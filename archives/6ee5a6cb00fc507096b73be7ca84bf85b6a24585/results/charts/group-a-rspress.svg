<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group A, rspress: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="170" rx="8"/>

  <g>
    <title>Rslint: 582 ms (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">582 ms</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 1.03 s (1.77× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,54H540.1167566081417A4,4 0 0 1 544.1167566081417,58V74A4,4 0 0 1 540.1167566081417,78H186Z"/>
    <text class="ratio" x="536.1167566081417" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.77×</text>
    <text class="t-secondary" x="554.1167566081417" y="66" dominant-baseline="central" font-size="14">1.03 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 1.31 s (2.25× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,92H663.6237307902957A4,4 0 0 1 667.6237307902957,96V112A4,4 0 0 1 663.6237307902957,116H186Z"/>
    <text class="ratio" x="659.6237307902957" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.25×</text>
    <text class="t-secondary" x="677.6237307902957" y="104" dominant-baseline="central" font-size="14">1.31 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs): 1.32 s (2.26× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,130H666A4,4 0 0 1 670,134V150A4,4 0 0 1 666,154H186Z"/>
    <text class="ratio" x="662" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.26×</text>
    <text class="t-secondary" x="680" y="142" dominant-baseline="central" font-size="14">1.32 s</text>
  </g>
</svg>
