<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, rsbuild: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Biome: 603 ms (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">603 ms</text>
  </g>
  <g>
    <title>Rslint: 655 ms (1.09× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,54H289.67747335370404A4,4 0 0 1 293.67747335370404,58V74A4,4 0 0 1 289.67747335370404,78H186Z"/>
    <text class="ratio" x="285.67747335370404" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.09×</text>
    <text class="t-secondary" x="303.67747335370404" y="66" dominant-baseline="central" font-size="14">655 ms</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 1.24 s (2.05× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,92H603.7550369072509A4,4 0 0 1 607.7550369072509,96V112A4,4 0 0 1 603.7550369072509,116H186Z"/>
    <text class="ratio" x="599.7550369072509" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.05×</text>
    <text class="t-secondary" x="617.7550369072509" y="104" dominant-baseline="central" font-size="14">1.24 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs): 1.36 s (2.25× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,130H649.0934552087073A4,4 0 0 1 653.0934552087073,134V150A4,4 0 0 1 649.0934552087073,154H186Z"/>
    <text class="ratio" x="645.0934552087073" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.25×</text>
    <text class="t-secondary" x="663.0934552087073" y="142" dominant-baseline="central" font-size="14">1.36 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 1.41 s (2.33× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
    <text class="ratio" x="662" y="180" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.33×</text>
    <text class="t-secondary" x="680" y="180" dominant-baseline="central" font-size="14">1.41 s</text>
  </g>
</svg>
