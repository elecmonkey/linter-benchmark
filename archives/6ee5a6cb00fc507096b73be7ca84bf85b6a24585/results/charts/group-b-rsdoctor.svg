<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, rsdoctor: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Rslint: 621 ms (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">621 ms</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 709 ms (1.14× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,54H318.22887087737854A4,4 0 0 1 322.22887087737854,58V74A4,4 0 0 1 318.22887087737854,78H186Z"/>
    <text class="ratio" x="314.22887087737854" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.14×</text>
    <text class="t-secondary" x="332.22887087737854" y="66" dominant-baseline="central" font-size="14">709 ms</text>
  </g>
  <g>
    <title>Oxlint (tsrs): 731 ms (1.18× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,92H333.89411270974267A4,4 0 0 1 337.89411270974267,96V112A4,4 0 0 1 333.89411270974267,116H186Z"/>
    <text class="ratio" x="329.89411270974267" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.18×</text>
    <text class="t-secondary" x="347.89411270974267" y="104" dominant-baseline="central" font-size="14">731 ms</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 962 ms (1.55× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,130H476.68663252608326A4,4 0 0 1 480.68663252608326,134V150A4,4 0 0 1 476.68663252608326,154H186Z"/>
    <text class="ratio" x="472.68663252608326" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.55×</text>
    <text class="t-secondary" x="490.68663252608326" y="142" dominant-baseline="central" font-size="14">962 ms</text>
  </g>
  <g>
    <title>Biome: 1.38 s (2.23× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
    <text class="ratio" x="662" y="180" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.23×</text>
    <text class="t-secondary" x="680" y="180" dominant-baseline="central" font-size="14">1.38 s</text>
  </g>
