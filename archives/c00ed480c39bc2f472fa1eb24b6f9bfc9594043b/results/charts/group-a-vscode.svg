    <path class="bar-oxlint-tsgolint" d="M186,92H665.1705288765564A4,4 0 0 1 669.1705288765564,96V112A4,4 0 0 1 665.1705288765564,116H186Z"/>
    <text class="ratio" x="661.1705288765564" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">3.43×</text>
    <text class="t-secondary" x="679.1705288765564" y="104" dominant-baseline="central" font-size="14">97.3 s</text>
  </g>
  <g>
    <title>Rslint: 97.6 s (3.44× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
