<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, rslib: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Oxlint (tsrs): 1.05 s (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">1.05 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 1.06 s (1.01× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,54H253.4917475745267A4,4 0 0 1 257.4917475745267,58V74A4,4 0 0 1 253.4917475745267,78H186Z"/>
    <text class="ratio" x="249.4917475745267" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.01×</text>
    <text class="t-secondary" x="267.4917475745267" y="66" dominant-baseline="central" font-size="14">1.06 s</text>
  </g>
  <g>
    <title>Biome: 1.81 s (1.72× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,92H520.8369127328748A4,4 0 0 1 524.8369127328748,96V112A4,4 0 0 1 520.8369127328748,116H186Z"/>
    <text class="ratio" x="516.8369127328748" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.72×</text>
    <text class="t-secondary" x="534.8369127328748" y="104" dominant-baseline="central" font-size="14">1.81 s</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 2.25 s (2.13× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,130H629.2014937616632A4,4 0 0 1 633.2014937616632,134V150A4,4 0 0 1 629.2014937616632,154H186Z"/>
    <text class="ratio" x="625.2014937616632" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.13×</text>
    <text class="t-secondary" x="643.2014937616632" y="142" dominant-baseline="central" font-size="14">2.25 s</text>
  </g>
  <g>
    <title>Rslint: 2.42 s (2.29× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
    <text class="ratio" x="662" y="180" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.29×</text>
    <text class="t-secondary" x="680" y="180" dominant-baseline="central" font-size="14">2.42 s</text>
  </g>
</svg>
