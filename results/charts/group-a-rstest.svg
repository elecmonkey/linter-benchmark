<svg xmlns="http://www.w3.org/2000/svg" width="760" height="132" viewBox="0 0 760 132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group A, rstest: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-eslint { fill: #2a78d6; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-eslint { fill: #3987e5; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="132" rx="8"/>

  <g>
    <title>Rslint: 937 ms (fastest)</title>
    <text class="t-secondary" x="110" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M126,16H189A4,4 0 0 1 193,20V36A4,4 0 0 1 189,40H126Z"/>
    <text class="ratio" x="185" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="203" y="28" dominant-baseline="central" font-size="14">937 ms</text>
  </g>
  <g>
    <title>Oxlint: 1.18 s (1.26× the fastest)</title>
    <text class="t-secondary" x="110" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint</text>
    <path class="bar-oxlint" d="M126,54H227.0608597786007A4,4 0 0 1 231.0608597786007,58V74A4,4 0 0 1 227.0608597786007,78H126Z"/>
    <text class="ratio" x="223.0608597786007" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.26×</text>
    <text class="t-secondary" x="241.0608597786007" y="66" dominant-baseline="central" font-size="14">1.18 s</text>
  </g>
  <g>
    <title>ESLint: 17.2 s (18.39× the fastest)</title>
    <text class="t-secondary" x="110" y="104" text-anchor="end" dominant-baseline="central" font-size="15">ESLint</text>
    <path class="bar-eslint" d="M126,92H666A4,4 0 0 1 670,96V112A4,4 0 0 1 666,116H126Z"/>
    <text class="ratio" x="662" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">18.39×</text>
    <text class="t-secondary" x="680" y="104" dominant-baseline="central" font-size="14">17.2 s</text>
  </g>
</svg>
