<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, rsdoctor: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Oxlint (tsrs): 1.24 s (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">1.24 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 1.24 s (1.00× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,54H249.06498331773878A4,4 0 0 1 253.06498331773878,58V74A4,4 0 0 1 249.06498331773878,78H186Z"/>
    <text class="ratio" x="245.06498331773878" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263.0649833177388" y="66" dominant-baseline="central" font-size="14">1.24 s</text>
  </g>
  <g>
    <title>Biome: 2.16 s (1.74× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,92H498.96111630515475A4,4 0 0 1 502.96111630515475,96V112A4,4 0 0 1 498.96111630515475,116H186Z"/>
    <text class="ratio" x="494.96111630515475" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.74×</text>
    <text class="t-secondary" x="512.9611163051547" y="104" dominant-baseline="central" font-size="14">2.16 s</text>
  </g>
  <g>
    <title>Rslint: 3.05 s (2.46× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,130H653.1522214307137A4,4 0 0 1 657.1522214307137,134V150A4,4 0 0 1 653.1522214307137,154H186Z"/>
    <text class="ratio" x="649.1522214307137" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.46×</text>
    <text class="t-secondary" x="667.1522214307137" y="142" dominant-baseline="central" font-size="14">3.05 s</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 3.13 s (2.53× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
    <text class="ratio" x="662" y="180" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.53×</text>
    <text class="t-secondary" x="680" y="180" dominant-baseline="central" font-size="14">3.13 s</text>
  </g>
