<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, rspack: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Oxlint (tsrs): 835 ms (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">835 ms</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 843 ms (1.01× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,54H257.46027438360875A4,4 0 0 1 261.46027438360875,58V74A4,4 0 0 1 257.46027438360875,78H186Z"/>
    <text class="ratio" x="253.46027438360875" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.01×</text>
    <text class="t-secondary" x="271.46027438360875" y="66" dominant-baseline="central" font-size="14">843 ms</text>
  </g>
  <g>
    <title>Biome: 1.17 s (1.40× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,92H570.6395990926158A4,4 0 0 1 574.6395990926158,96V112A4,4 0 0 1 570.6395990926158,116H186Z"/>
    <text class="ratio" x="566.6395990926158" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.40×</text>
    <text class="t-secondary" x="584.6395990926158" y="104" dominant-baseline="central" font-size="14">1.17 s</text>
  </g>
  <g>
    <title>Rslint: 1.19 s (1.43× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,130H589.1092276684981A4,4 0 0 1 593.1092276684981,134V150A4,4 0 0 1 589.1092276684981,154H186Z"/>
    <text class="ratio" x="585.1092276684981" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.43×</text>
    <text class="t-secondary" x="603.1092276684981" y="142" dominant-baseline="central" font-size="14">1.19 s</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 1.30 s (1.55× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
    <text class="ratio" x="662" y="180" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.55×</text>
    <text class="t-secondary" x="680" y="180" dominant-baseline="central" font-size="14">1.30 s</text>
  </g>
</svg>
