<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, rstack-cli: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Biome: 551 ms (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">551 ms</text>
  </g>
  <g>
    <title>Rslint: 879 ms (1.60× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,54H433.8538948909582A4,4 0 0 1 437.8538948909582,58V74A4,4 0 0 1 433.8538948909582,78H186Z"/>
    <text class="ratio" x="429.8538948909582" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.60×</text>
    <text class="t-secondary" x="447.8538948909582" y="66" dominant-baseline="central" font-size="14">879 ms</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 993 ms (1.80× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,92H481.9026637098585A4,4 0 0 1 485.9026637098585,96V112A4,4 0 0 1 481.9026637098585,116H186Z"/>
    <text class="ratio" x="477.9026637098585" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.80×</text>
    <text class="t-secondary" x="495.9026637098585" y="104" dominant-baseline="central" font-size="14">993 ms</text>
  </g>
  <g>
    <title>Oxlint (tsrs): 1.57 s (2.86× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,130H664.3461346720496A4,4 0 0 1 668.3461346720496,134V150A4,4 0 0 1 664.3461346720496,154H186Z"/>
    <text class="ratio" x="660.3461346720496" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.86×</text>
    <text class="t-secondary" x="678.3461346720496" y="142" dominant-baseline="central" font-size="14">1.57 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs --fast): 1.58 s (2.87× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
    <text class="ratio" x="662" y="180" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.87×</text>
    <text class="t-secondary" x="680" y="180" dominant-baseline="central" font-size="14">1.58 s</text>
