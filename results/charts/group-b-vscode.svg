    <path class="bar-rslint" d="M186,92H485.475910521088A4,4 0 0 1 489.475910521088,96V112A4,4 0 0 1 485.475910521088,116H186Z"/>
    <text class="ratio" x="481.475910521088" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.46×</text>
    <text class="t-secondary" x="499.475910521088" y="104" dominant-baseline="central" font-size="14">11.6 s</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 13.2 s (2.79× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,130H518.6158118073234A4,4 0 0 1 522.6158118073234,134V150A4,4 0 0 1 518.6158118073234,154H186Z"/>
