<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" viewBox="0 0 760 208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, vscode: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-oxlint-tsgolint { fill: #1baf7a; }
    .bar-oxlint-tsrs { fill: #9362cc; }
    .bar-oxlint-tsrs-fast { fill: #247eab; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-oxlint-tsgolint { fill: #199e70; }
      .bar-oxlint-tsrs { fill: #a47ad7; }
      .bar-oxlint-tsrs-fast { fill: #3b94bd; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="208" rx="8"/>

  <g>
    <title>Oxlint (tsrs --fast): 17.7 s (fastest)</title>
    <text class="t-secondary" x="170" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs --fast)</text>
    <path class="bar-oxlint-tsrs-fast" d="M186,16H249A4,4 0 0 1 253,20V36A4,4 0 0 1 249,40H186Z"/>
    <text class="ratio" x="245" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="263" y="28" dominant-baseline="central" font-size="14">17.7 s</text>
  </g>
  <g>
    <title>Oxlint (tsrs): 17.9 s (1.01× the fastest)</title>
    <text class="t-secondary" x="170" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsrs)</text>
    <path class="bar-oxlint-tsrs" d="M186,54H251.84154948737068A4,4 0 0 1 255.84154948737068,58V74A4,4 0 0 1 251.84154948737068,78H186Z"/>
    <text class="ratio" x="247.84154948737068" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.01×</text>
    <text class="t-secondary" x="265.8415494873707" y="66" dominant-baseline="central" font-size="14">17.9 s</text>
  </g>
  <g>
    <title>Oxlint (tsgolint): 51.1 s (2.89× the fastest)</title>
    <text class="t-secondary" x="170" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint (tsgolint)</text>
    <path class="bar-oxlint-tsgolint" d="M186,92H508.7032706081843A4,4 0 0 1 512.7032706081843,96V112A4,4 0 0 1 508.7032706081843,116H186Z"/>
    <text class="ratio" x="504.7032706081843" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.89×</text>
    <text class="t-secondary" x="522.7032706081843" y="104" dominant-baseline="central" font-size="14">51.1 s</text>
  </g>
  <g>
    <title>Rslint: 52.9 s (2.99× the fastest)</title>
    <text class="t-secondary" x="170" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M186,130H517.0324257652583A4,4 0 0 1 521.0324257652583,134V150A4,4 0 0 1 517.0324257652583,154H186Z"/>
    <text class="ratio" x="513.0324257652583" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">2.99×</text>
    <text class="t-secondary" x="531.0324257652583" y="142" dominant-baseline="central" font-size="14">52.9 s</text>
  </g>
  <g>
    <title>Biome: 97.3 s (5.50× the fastest)</title>
    <text class="t-secondary" x="170" y="180" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M186,168H666A4,4 0 0 1 670,172V188A4,4 0 0 1 666,192H186Z"/>
