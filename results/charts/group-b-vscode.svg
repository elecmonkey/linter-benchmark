    <path class="bar-oxlint-tsrs" d="M186,54H318.6972868501624A4,4 0 0 1 322.6972868501624,58V74A4,4 0 0 1 318.6972868501624,78H186Z"/>
    <text class="ratio" x="314.6972868501624" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.30×</text>
    <text class="t-secondary" x="332.6972868501624" y="66" dominant-baseline="central" font-size="14">6.16 s</text>
  </g>
  <g>
    <title>Rslint: 11.6 s (2.46× the fastest)</title>
