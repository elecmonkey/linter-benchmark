<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group B, vscode: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-eslint { fill: #2a78d6; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-eslint { fill: #3987e5; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="170" rx="8"/>

  <g>
    <title>Rslint: 336 ms (fastest)</title>
    <text class="t-secondary" x="110" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M126,16H189A4,4 0 0 1 193,20V36A4,4 0 0 1 189,40H126Z"/>
    <text class="ratio" x="185" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="203" y="28" dominant-baseline="central" font-size="14">336 ms</text>
  </g>
  <g>
    <title>Oxlint: 492 ms (1.46× the fastest)</title>
    <text class="t-secondary" x="110" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint</text>
    <path class="bar-oxlint" d="M126,54H258.79875271436504A4,4 0 0 1 262.79875271436504,58V74A4,4 0 0 1 258.79875271436504,78H126Z"/>
    <text class="ratio" x="254.79875271436504" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.46×</text>
    <text class="t-secondary" x="272.79875271436504" y="66" dominant-baseline="central" font-size="14">492 ms</text>
  </g>
  <g>
    <title>ESLint: 4.18 s (12.41× the fastest)</title>
    <text class="t-secondary" x="110" y="104" text-anchor="end" dominant-baseline="central" font-size="15">ESLint</text>
    <path class="bar-eslint" d="M126,92H651.69147134374A4,4 0 0 1 655.69147134374,96V112A4,4 0 0 1 651.69147134374,116H126Z"/>
    <text class="ratio" x="647.69147134374" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">12.41×</text>
    <text class="t-secondary" x="665.69147134374" y="104" dominant-baseline="central" font-size="14">4.18 s</text>
  </g>
  <g>
    <title>Biome: 4.51 s (13.42× the fastest)</title>
    <text class="t-secondary" x="110" y="142" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M126,130H666A4,4 0 0 1 670,134V150A4,4 0 0 1 666,154H126Z"/>
    <text class="ratio" x="662" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">13.42×</text>
    <text class="t-secondary" x="680" y="142" dominant-baseline="central" font-size="14">4.51 s</text>
  </g>
</svg>
