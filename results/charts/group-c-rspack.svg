<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Group C, rspack: median wall time, lower is better">
  <style>
    .surface { fill: #fcfcfb; }
    .t-primary { fill: #0b0b0b; }
    .t-secondary { fill: #52514e; }
    .ratio { fill: #ffffff; }
    .bar-eslint { fill: #2a78d6; }
    .bar-rslint { fill: #eb6834; }
    .bar-oxlint { fill: #1baf7a; }
    .bar-biome { fill: #eda100; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-primary { fill: #f0efec; }
      .t-secondary { fill: #c3c2b7; }
      .bar-eslint { fill: #3987e5; }
      .bar-rslint { fill: #d95926; }
      .bar-oxlint { fill: #199e70; }
      .bar-biome { fill: #c98500; }
    }
  </style>
  <rect class="surface" width="760" height="170" rx="8"/>

  <g>
    <title>Oxlint: 188 ms (fastest)</title>
    <text class="t-secondary" x="110" y="28" text-anchor="end" dominant-baseline="central" font-size="15">Oxlint</text>
    <path class="bar-oxlint" d="M126,16H189A4,4 0 0 1 193,20V36A4,4 0 0 1 189,40H126Z"/>
    <text class="ratio" x="185" y="28" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.00×</text>
    <text class="t-secondary" x="203" y="28" dominant-baseline="central" font-size="14">188 ms</text>
  </g>
  <g>
    <title>Rslint: 242 ms (1.29× the fastest)</title>
    <text class="t-secondary" x="110" y="66" text-anchor="end" dominant-baseline="central" font-size="15">Rslint</text>
    <path class="bar-rslint" d="M126,54H248.28205692587915A4,4 0 0 1 252.28205692587915,58V74A4,4 0 0 1 248.28205692587915,78H126Z"/>
    <text class="ratio" x="244.28205692587915" y="66" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.29×</text>
    <text class="t-secondary" x="262.28205692587915" y="66" dominant-baseline="central" font-size="14">242 ms</text>
  </g>
  <g>
    <title>Biome: 244 ms (1.30× the fastest)</title>
    <text class="t-secondary" x="110" y="104" text-anchor="end" dominant-baseline="central" font-size="15">Biome</text>
    <path class="bar-biome" d="M126,92H250.05236299169707A4,4 0 0 1 254.05236299169707,96V112A4,4 0 0 1 250.05236299169707,116H126Z"/>
    <text class="ratio" x="246.05236299169707" y="104" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">1.30×</text>
    <text class="t-secondary" x="264.05236299169707" y="104" dominant-baseline="central" font-size="14">244 ms</text>
  </g>
  <g>
    <title>ESLint: 1.45 s (7.73× the fastest)</title>
    <text class="t-secondary" x="110" y="142" text-anchor="end" dominant-baseline="central" font-size="15">ESLint</text>
    <path class="bar-eslint" d="M126,130H666A4,4 0 0 1 670,134V150A4,4 0 0 1 666,154H126Z"/>
    <text class="ratio" x="662" y="142" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="700">7.73×</text>
    <text class="t-secondary" x="680" y="142" dominant-baseline="central" font-size="14">1.45 s</text>
  </g>
</svg>
